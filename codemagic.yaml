# =============================================================================
# codemagic.yaml - The Dread Directory
# Signed TestFlight workflow + unsigned smoke test.
# Injects iOS Info.plist permission strings (location + camera) automatically
# after Capacitor scaffolds the iOS project, before the build runs.
# Also writes the App.entitlements file with Sign in with Apple capability
# and patches project.pbxproj using a python one-liner to point each App
# target config at the entitlements file. The python approach avoids the
# YAML/sed tab-character mess and is more reliable across pbxproj layouts.
# =============================================================================
workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build (Pre-signing Smoke Test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app (Vite)
        script: |
          npm run build
      - name: Add iOS platform (Capacitor)
        script: |
          npx cap add ios
      - name: Inject Info.plist permission strings
        script: |
          PLIST="ios/App/App/Info.plist"
          plutil -insert NSLocationWhenInUseUsageDescription -string "The Dread Directory uses your location to show you nearby haunted, historical, and macabre sites." "$PLIST" || \
            plutil -replace NSLocationWhenInUseUsageDescription -string "The Dread Directory uses your location to show you nearby haunted, historical, and macabre sites." "$PLIST"
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "The Dread Directory needs background location access to notify you when you're near a sinister site, even when the app is closed." "$PLIST" || \
            plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "The Dread Directory needs background location access to notify you when you're near a sinister site, even when the app is closed." "$PLIST"
          plutil -insert NSLocationAlwaysUsageDescription -string "The Dread Directory needs background location to ping you when you're near a sinister site." "$PLIST" || \
            plutil -replace NSLocationAlwaysUsageDescription -string "The Dread Directory needs background location to ping you when you're near a sinister site." "$PLIST"
          plutil -insert NSCameraUsageDescription -string "The Dread Directory uses your camera so you can take a verification photo when submitting a new sinister site." "$PLIST" || \
            plutil -replace NSCameraUsageDescription -string "The Dread Directory uses your camera so you can take a verification photo when submitting a new sinister site." "$PLIST"
          plutil -insert NSMotionUsageDescription -string "The Dread Directory uses motion sensors to efficiently detect when you're moving, so it only checks for nearby sinister sites when needed and saves your battery." "$PLIST" || \
            plutil -replace NSMotionUsageDescription -string "The Dread Directory uses motion sensors to efficiently detect when you're moving, so it only checks for nearby sinister sites when needed and saves your battery." "$PLIST"
          plutil -insert UIBackgroundModes -array "$PLIST" 2>/dev/null || true
          plutil -insert UIBackgroundModes.0 -string location "$PLIST" 2>/dev/null || true
          plutil -insert UIBackgroundModes.1 -string fetch "$PLIST" 2>/dev/null || true
          echo "--- Final Info.plist ---"
          plutil -p "$PLIST"
      - name: Write App.entitlements (Sign in with Apple)
        script: |
          ENT="ios/App/App/App.entitlements"
          cat > "$ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
          </dict>
          </plist>
          EOF
          echo "--- App.entitlements written ---"
          plutil -p "$ENT"
      - name: Patch Xcode project to use entitlements file
        script: |
          python3 <<'PYEOF'
          import re
          path = "ios/App/App.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          before = content.count("CODE_SIGN_ENTITLEMENTS")
          print("BEFORE: CODE_SIGN_ENTITLEMENTS count =", before)
          bundle_line = "PRODUCT_BUNDLE_IDENTIFIER = com.sinistertrivia.macabretest;"
          insert_line = "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;"
          new_content = content.replace(
              bundle_line,
              bundle_line + "\n\t\t\t\t" + insert_line
          )
          with open(path, "w") as f:
              f.write(new_content)
          after = new_content.count("CODE_SIGN_ENTITLEMENTS")
          print("AFTER: CODE_SIGN_ENTITLEMENTS count =", after)
          print("Bundle ID occurrences patched:", new_content.count(bundle_line))
          PYEOF
      - name: Sync Capacitor to iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Build unsigned .app for simulator (smoke test)
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/**/*.app
      - ios/App/build/**/*.dSYM.zip
    publishing:
      email:
        recipients:
          - drewkrotz@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight Build (Signed)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Codemagic TestFlight
    environment:
      groups:
        - code-signing
      node: 22
      xcode: 26.2
      cocoapods: default
      vars:
        APP_STORE_APP_ID: "6765894869"
        BUNDLE_ID: "com.sinistertrivia.macabretest"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app (Vite)
        script: |
          npm run build
      - name: Add iOS platform (Capacitor)
        script: |
          npx cap add ios
      - name: Inject Info.plist permission strings
        script: |
          PLIST="ios/App/App/Info.plist"
          plutil -insert NSLocationWhenInUseUsageDescription -string "The Dread Directory uses your location to show you nearby haunted, historical, and macabre sites." "$PLIST" || \
            plutil -replace NSLocationWhenInUseUsageDescription -string "The Dread Directory uses your location to show you nearby haunted, historical, and macabre sites." "$PLIST"
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "The Dread Directory needs background location access to notify you when you're near a sinister site, even when the app is closed." "$PLIST" || \
            plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "The Dread Directory needs background location access to notify you when you're near a sinister site, even when the app is closed." "$PLIST"
          plutil -insert NSLocationAlwaysUsageDescription -string "The Dread Directory needs background location to ping you when you're near a sinister site." "$PLIST" || \
            plutil -replace NSLocationAlwaysUsageDescription -string "The Dread Directory needs background location to ping you when you're near a sinister site." "$PLIST"
          plutil -insert NSCameraUsageDescription -string "The Dread Directory uses your camera so you can take a verification photo when submitting a new sinister site." "$PLIST" || \
            plutil -replace NSCameraUsageDescription -string "The Dread Directory uses your camera so you can take a verification photo when submitting a new sinister site." "$PLIST"
          plutil -insert NSMotionUsageDescription -string "The Dread Directory uses motion sensors to efficiently detect when you're moving, so it only checks for nearby sinister sites when needed and saves your battery." "$PLIST" || \
            plutil -replace NSMotionUsageDescription -string "The Dread Directory uses motion sensors to efficiently detect when you're moving, so it only checks for nearby sinister sites when needed and saves your battery." "$PLIST"
          plutil -insert UIBackgroundModes -array "$PLIST" 2>/dev/null || true
          plutil -insert UIBackgroundModes.0 -string location "$PLIST" 2>/dev/null || true
          plutil -insert UIBackgroundModes.1 -string fetch "$PLIST" 2>/dev/null || true
          echo "--- Final Info.plist ---"
          plutil -p "$PLIST"
      - name: Write App.entitlements (Sign in with Apple)
        script: |
          ENT="ios/App/App/App.entitlements"
          cat > "$ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF
          echo "--- App.entitlements written ---"
          plutil -p "$ENT"
      - name: Patch Xcode project to use entitlements file
        script: |
          python3 <<'PYEOF'
          import re
          path = "ios/App/App.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          before = content.count("CODE_SIGN_ENTITLEMENTS")
          print("BEFORE: CODE_SIGN_ENTITLEMENTS count =", before)
          bundle_line = "PRODUCT_BUNDLE_IDENTIFIER = com.sinistertrivia.macabretest;"
          insert_line = "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;"
          new_content = content.replace(
              bundle_line,
              bundle_line + "\n\t\t\t\t" + insert_line
          )
          with open(path, "w") as f:
              f.write(new_content)
          after = new_content.count("CODE_SIGN_ENTITLEMENTS")
          print("AFTER: CODE_SIGN_ENTITLEMENTS count =", after)
          print("Bundle ID occurrences patched:", new_content.count(bundle_line))
          PYEOF
      - name: Sync Capacitor to iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          # Use get-latest-build-number (NOT get-latest-testflight-build-number).
          # The testflight variant only counts builds that have fully processed
          # and are available for testing — it misses builds that uploaded but
          # are still processing, were rejected after upload, or are stuck in
          # Apple's queue. That can return a stale number, the script adds 1,
          # and Apple rejects the upload as a duplicate.
          # The non-testflight variant counts ALL builds including processing
          # and rejected ones, so the +1 always lands on a fresh number.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" || echo "1")
          # Apple has phantom builds at numbers higher than what their API
          # returns (build 34 was rejecting as duplicate even when API said
          # latest was 33). Use a floor of 40 to skip past any phantoms.
          # Bump this floor up if we ever hit a duplicate again.
          NEXT_BUILD=$((LATEST_BUILD_NUMBER + 1))
          if [ "$NEXT_BUILD" -lt 41 ]; then NEXT_BUILD=41; fi
          agvtool new-marketing-version 1.10 && agvtool new-version -all "$NEXT_BUILD"
      - name: Build signed .ipa for App Store
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App \
            --config Release
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/**/*.dSYM.zip
    publishing:
      email:
        recipients:
          - drewkrotz@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
