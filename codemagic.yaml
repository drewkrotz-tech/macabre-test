# =============================================================================
# codemagic.yaml - The Dread Directory
# Signed TestFlight workflow + unsigned smoke test.
# Injects iOS Info.plist permission strings (location + camera + microphone +
# photo library) automatically after Capacitor scaffolds the iOS project,
# before the build runs.
# Also writes the App.entitlements file with Sign in with Apple capability
# and patches project.pbxproj using a python one-liner to point each App
# target config at the entitlements file.
# AppIcon assets are generated from appicon_master.b64 (a base64-encoded
# 1024x1024 master PNG kept at the repo root) and copied into the
# Capacitor-generated iOS folder so home-screen and notification icons
# survive the npx cap add ios scaffolding.
# =============================================================================
workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build (Pre-signing Smoke Test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app (Vite)
        script: |
          npm run build
      - name: Add iOS platform (Capacitor)
        script: |
          npx cap add ios
      - name: Generate AppIcon assets and copy into iOS asset catalog
        script: |
          set -e
          if [ ! -f "appicon_master.b64" ]; then
            echo "ERROR: appicon_master.b64 not found at repo root. App icon will be generic."
            exit 1
          fi
          DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$DEST"
          base64 -D -i appicon_master.b64 -o "$DEST/Icon-1024.png"
          echo "Master decoded: $(ls -la $DEST/Icon-1024.png)"
          SIZES=(
            "Icon-20@2x.png:40"
            "Icon-20@3x.png:60"
            "Icon-29@2x.png:58"
            "Icon-29@3x.png:87"
            "Icon-40@2x.png:80"
            "Icon-40@3x.png:120"
            "Icon-60@2x.png:120"
            "Icon-60@3x.png:180"
            "Icon-20.png:20"
            "Icon-20@2x-ipad.png:40"
            "Icon-29.png:29"
            "Icon-29@2x-ipad.png:58"
            "Icon-40.png:40"
            "Icon-40@2x-ipad.png:80"
            "Icon-76.png:76"
            "Icon-76@2x.png:152"
            "Icon-83.5@2x.png:167"
          )
          for entry in "${SIZES[@]}"; do
            FNAME="${entry%%:*}"
            SIZE="${entry##*:}"
            sips -z "$SIZE" "$SIZE" "$DEST/Icon-1024.png" --out "$DEST/$FNAME" > /dev/null
          done
          cat > "$DEST/Contents.json" <<'JSON_EOF'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"Icon-20@2x.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"Icon-20@3x.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"Icon-29@2x.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"Icon-29@3x.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"Icon-40@2x.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"Icon-40@3x.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"Icon-60@2x.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"Icon-60@3x.png","scale":"3x"},
              {"size":"20x20","idiom":"ipad","filename":"Icon-20.png","scale":"1x"},
              {"size":"20x20","idiom":"ipad","filename":"Icon-20@2x-ipad.png","scale":"2x"},
              {"size":"29x29","idiom":"ipad","filename":"Icon-29.png","scale":"1x"},
              {"size":"29x29","idiom":"ipad","filename":"Icon-29@2x-ipad.png","scale":"2x"},
              {"size":"40x40","idiom":"ipad","filename":"Icon-40.png","scale":"1x"},
              {"size":"40x40","idiom":"ipad","filename":"Icon-40@2x-ipad.png","scale":"2x"},
              {"size":"76x76","idiom":"ipad","filename":"Icon-76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"Icon-76@2x.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"Icon-83.5@2x.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"Icon-1024.png","scale":"1x"}
            ],
            "info": {"version": 1, "author": "xcode"}
          }
          JSON_EOF
          echo "--- AppIcon files in iOS asset catalog ---"
          ls -la "$DEST"
      - name: Inject Info.plist permission strings
        script: |
          PLIST="ios/App/App/Info.plist"
          # Force the user-facing app name to "The Dread Directory" regardless
          # of what Capacitor wrote during npx cap add ios. CFBundleDisplayName
          # is what iOS shows on the home screen and Settings; CFBundleName is
          # used internally. Patching both keeps everything consistent.
          plutil -replace CFBundleDisplayName -string "The Dread Directory" "$PLIST" || \
            plutil -insert CFBundleDisplayName -string "The Dread Directory" "$PLIST"
          plutil -replace CFBundleName -string "The Dread Directory" "$PLIST" || \
            plutil -insert CFBundleName -string "The Dread Directory" "$PLIST"
          plutil -insert NSLocationWhenInUseUsageDescription -string "The Dread Directory uses your location to show you nearby haunted, historical, and macabre sites." "$PLIST" || \
            plutil -replace NSLocationWhenInUseUsageDescription -string "The Dread Directory uses your location to show you nearby haunted, historical, and macabre sites." "$PLIST"
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "The Dread Directory needs background location access to notify you when you're near a sinister site, even when the app is closed." "$PLIST" || \
            plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "The Dread Directory needs background location access to notify you when you're near a sinister site, even when the app is closed." "$PLIST"
          plutil -insert NSLocationAlwaysUsageDescription -string "The Dread Directory needs background location to ping you when you're near a sinister site." "$PLIST" || \
            plutil -replace NSLocationAlwaysUsageDescription -string "The Dread Directory needs background location to ping you when you're near a sinister site." "$PLIST"
          plutil -insert NSCameraUsageDescription -string "The Dread Directory uses your camera so you can take a verification photo when submitting a new sinister site." "$PLIST" || \
            plutil -replace NSCameraUsageDescription -string "The Dread Directory uses your camera so you can take a verification photo when submitting a new sinister site." "$PLIST"
          plutil -insert NSMicrophoneUsageDescription -string "The Dread Directory uses your microphone to record audio when you capture a video for a DreadFeed post." "$PLIST" || \
            plutil -replace NSMicrophoneUsageDescription -string "The Dread Directory uses your microphone to record audio when you capture a video for a DreadFeed post." "$PLIST"
          plutil -insert NSPhotoLibraryUsageDescription -string "The Dread Directory needs photo library access so you can pick photos and videos for your DreadFeed posts." "$PLIST" || \
            plutil -replace NSPhotoLibraryUsageDescription -string "The Dread Directory needs photo library access so you can pick photos and videos for your DreadFeed posts." "$PLIST"
          plutil -insert NSPhotoLibraryAddUsageDescription -string "The Dread Directory needs permission to save photos and videos to your library." "$PLIST" || \
            plutil -replace NSPhotoLibraryAddUsageDescription -string "The Dread Directory needs permission to save photos and videos to your library." "$PLIST"
          plutil -insert NSMotionUsageDescription -string "The Dread Directory uses motion sensors to efficiently detect when you're moving, so it only checks for nearby sinister sites when needed and saves your battery." "$PLIST" || \
            plutil -replace NSMotionUsageDescription -string "The Dread Directory uses motion sensors to efficiently detect when you're moving, so it only checks for nearby sinister sites when needed and saves your battery." "$PLIST"
          plutil -insert UIBackgroundModes -array "$PLIST" 2>/dev/null || true
          plutil -insert UIBackgroundModes.0 -string location "$PLIST" 2>/dev/null || true
          plutil -insert UIBackgroundModes.1 -string fetch "$PLIST" 2>/dev/null || true
          echo "--- Final Info.plist ---"
          plutil -p "$PLIST"
      - name: Write App.entitlements (Sign in with Apple)
        script: |
          ENT="ios/App/App/App.entitlements"
          cat > "$ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
          </dict>
          </plist>
          EOF
          echo "--- App.entitlements written ---"
          plutil -p "$ENT"
      - name: Patch Xcode project to use entitlements file
        script: |
          python3 <<'PYEOF'
          import re
          path = "ios/App/App.xcodeproj/project.pbxproj"
          with open(path, "r") as f:
              content = f.read()
          before = content.count("CODE_SIGN_ENTITLEMENTS")
          print("BEFORE: CODE_SIGN_ENTITLEMENTS count =", before)
          bundle_line = "PRODUCT_BUNDLE_IDENTIFIER = com.sinistertrivia.macabretest;"
          insert_line = "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;"
          new_content = content.replace(
              bundle_line,
              bundle_line + "\n\t\t\t\t" + insert_line
          )
          with open(path, "w") as f:
              f.write(new_content)
          after = new_content.count("CODE_SIGN_ENTITLEMENTS")
          print("AFTER: CODE_SIGN_ENTITLEMENTS count =", after)
          print("Bundle ID occurrences patched:", new_content.count(bundle_line))
          PYEOF
      - name: Sync Capacitor to iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Build unsigned .app for simulator (smoke test)
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/**/*.app
      - ios/App/build/**/*.dSYM.zip
    publishing:
      email:
        recipients:
          - drewkrotz@gmail.com
        notify:
          success: true
          failure: true

